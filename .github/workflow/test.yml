name: Contact Management System Tests

on:
  push:
    branches:
      - "**"
    pull_request:
      branches:
        -main


    jobs:
      test:
        name: Build and Test
        runs-on: ubuntu-latest


        steps:
          - name: checkout repository
            uses: actions/checkout@v4
            with:
              distribution: temurin
              java-version: "17"
              cache: maven


          - name:
            run: mvn test

          - name: Build project
            run: mvn package -DskipTests